name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      rivet_repository:
        description: Rivet repository to build the engine and RivetKit from
        default: rivet-dev/rivet
      rivet_ref:
        description: Branch, tag or commit of that repository
        default: main

env:
  RIVET_REPOSITORY: ${{ inputs.rivet_repository || vars.RIVET_REPOSITORY || 'rivet-dev/rivet' }}
  RIVET_REF: ${{ inputs.rivet_ref || vars.RIVET_REF || 'main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            engine: rivet-engine.exe
          - os: macos-14
            arch: arm64
            engine: rivet-engine
          - os: macos-13
            arch: x64
            engine: rivet-engine
          - os: ubuntu-22.04
            arch: x64
            engine: rivet-engine
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: job-radar
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.RIVET_REPOSITORY }}
          ref: ${{ env.RIVET_REF }}
          path: rivet

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake pkg-config

      - name: Build the Rivet engine and RivetKit
        working-directory: rivet
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          cargo build --release -p rivet-engine
          pnpm --filter @rivetkit/rivetkit-napi build:force:release
          pnpm --filter "rivetkit..." --filter "@rivetkit/react..." --filter "@rivet-dev/claude-code..." build

      - name: Build Job Radar
        working-directory: job-radar
        shell: bash
        env:
          RIVET_ENGINE_BINARY_PATH: ${{ github.workspace }}/rivet/target/release/${{ matrix.engine }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm install
          pnpm release --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: job-radar-${{ runner.os }}-${{ matrix.arch }}
          path: |
            job-radar/release/*.exe
            job-radar/release/*.dmg
            job-radar/release/*.zip
            job-radar/release/*.AppImage
            job-radar/release/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
