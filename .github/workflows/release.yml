name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 0.1.3. Leave empty to only build.
        default: ""
      rivet_repository:
        description: Rivet repository to build the engine and RivetKit from
        default: octopols/rivet
      rivet_ref:
        description: Branch, tag or commit of that repository
        default: octopols/claude-code-integration

concurrency:
  group: release-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: false

env:
  RIVET_REPOSITORY: ${{ inputs.rivet_repository || vars.RIVET_REPOSITORY || 'octopols/rivet' }}
  RIVET_REF: ${{ inputs.rivet_ref || vars.RIVET_REF || 'octopols/claude-code-integration' }}
  VERSION: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            engine: rivet-engine.exe
          - os: macos-14
            arch: arm64
            engine: rivet-engine
          - os: macos-15-intel
            arch: x64
            engine: rivet-engine
          - os: ubuntu-22.04
            arch: x64
            engine: rivet-engine
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: job-radar
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.RIVET_REPOSITORY }}
          ref: ${{ env.RIVET_REF }}
          path: rivet

      - uses: pnpm/action-setup@v4
        with:
          version: 10.13.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rivet
            job-radar/installer/src-tauri

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake pkg-config libfuse2

      - name: Build the Rivet engine and RivetKit
        working-directory: rivet
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          cargo build --release -p rivet-engine
          pnpm --filter @rivetkit/rivetkit-napi build:force:release
          pnpm --filter "rivetkit..." --filter "@rivetkit/react..." --filter "@rivet-dev/claude-code..." build
          pnpm --filter rivetkit build:browser

      - name: Set the app version
        if: env.VERSION != ''
        working-directory: job-radar
        shell: bash
        run: npm pkg set version="${VERSION#v}"

      - name: Build Job Radar
        working-directory: job-radar
        shell: bash
        env:
          RIVET_ENGINE_BINARY_PATH: ${{ github.workspace }}/rivet/target/release/${{ matrix.engine }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK && 'true' || 'false' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          pnpm install
          pnpm release --arch ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: job-radar-${{ runner.os }}-${{ matrix.arch }}
          path: |
            job-radar/release/*.exe
            job-radar/release/*.dmg
            job-radar/release/*.zip
            job-radar/release/*.AppImage
            job-radar/release/*.tar.gz
          if-no-files-found: error

  publish:
    if: needs.build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || inputs.version != '')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          name: Job Radar ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.version) }}
          target_commitish: ${{ github.sha }}
          files: artifacts/*
          generate_release_notes: true
          make_latest: true
