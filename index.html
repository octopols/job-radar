<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<meta name="description" content="Jobs that fit your resume, pushed the moment companies post them." />
	<title>Job Radar</title>
	<link rel="icon" type="image/svg+xml" href="/icon.svg" />
	<meta name="theme-color" content="#c2410c" />
	<script>
		try {
			const stored = localStorage.getItem("job-radar-theme");
			const dark = stored === "dark" || ((stored === null || stored === "system") && matchMedia("(prefers-color-scheme: dark)").matches);
			document.documentElement.classList.toggle("dark", dark);
		} catch {}
	</script>
</head>
<body>
	<div id="root"></div>
	<script type="module" src="/src/renderer/main.tsx"></script>
</body>
</html>
